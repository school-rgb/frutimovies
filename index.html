<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> frutimovies </title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            vaultBg: 'transparent',
            vaultPanel: 'transparent',
            vaultCard: 'transparent',
            vaultBorder: 'rgba(255, 255, 255, 0.1)',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Absolute No Background - Fully Transparent Base */
    html, body {
      background-color: transparent !important;
      background: transparent !important;
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      color: #ffffff;
    }

    /* Monochrome Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    /* Ultra-Clear Glass Header */
    .glass-header {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Strict 2:3 Poster Aspect Ratio */
    .poster-card {
      aspect-ratio: 2 / 3;
    }

    /* Shimmer Skeleton Animation */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.8s infinite;
    }
  </style>
</head>
<body class="bg-transparent text-white antialiased min-h-screen flex flex-col selection:bg-white selection:text-black">

  <!-- TOP HEADER & MINIMAL SEARCH BAR -->
  <header class="sticky top-0 z-40 w-full glass-header px-2 sm:px-4 py-2.5">
    <div class="w-full flex items-center justify-between gap-2 sm:gap-4">
      
      <!-- Mode Switcher: Movies vs TV Shows -->
      <div class="flex items-center shrink-0">
        <div class="flex bg-black/40 border border-white/10 rounded p-0.5 backdrop-blur-md">
          <button 
            id="btnMovieMode" 
            class="px-3 py-1 rounded text-xs font-bold transition-all flex items-center gap-1.5 bg-white text-black shadow"
          >
            <i class="fa-solid fa-film text-[10px]"></i>
            <span class="tracking-wide">Movies</span>
          </button>
          <button 
            id="btnTvMode" 
            class="px-3 py-1 rounded text-xs font-bold transition-all flex items-center gap-1.5 text-neutral-400 hover:text-white"
          >
            <i class="fa-solid fa-tv text-[10px]"></i>
            <span class="tracking-wide">TV Shows</span>
          </button>
        </div>
      </div>

      <!-- Search Input -->
      <div class="relative flex-1 max-w-2xl mx-auto group">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-neutral-400 text-xs group-focus-within:text-white transition-colors"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search vault..." 
          class="w-full bg-black/40 backdrop-blur-md text-xs sm:text-sm text-white placeholder-neutral-400 rounded pl-10 pr-10 py-1.5 border border-white/10 focus:border-white/40 focus:outline-none transition-all shadow-inner"
          autocomplete="off"
        >
        <button id="btnClearSearch" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-white p-1 transition-colors">
          <i class="fa-solid fa-xmark text-xs"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- MAIN POSTER GRID SECTION -->
  <main class="flex-1 w-full p-1 sm:p-2">
    <div 
      id="posterGrid" 
      class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 2xl:grid-cols-10 gap-1 sm:gap-2 w-full min-h-[85vh]"
    ></div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden min-h-[60vh] flex flex-col items-center justify-center text-center p-6">
      <div class="w-12 h-12 rounded-full bg-black/40 backdrop-blur-md border border-white/10 flex items-center justify-center mb-3 text-neutral-400">
        <i class="fa-solid fa-ghost text-xl"></i>
      </div>
      <h3 class="text-xs font-bold text-neutral-300 uppercase tracking-widest">No Posters Found</h3>
      <button id="btnResetSearch" class="mt-4 px-4 py-1.5 bg-white text-black text-xs font-bold rounded hover:bg-neutral-200 transition-all shadow">
        Reset Search
      </button>
    </div>

    <!-- Pagination -->
    <div id="paginationContainer" class="py-8 flex justify-center items-center">
      <button 
        id="btnLoadMore" 
        class="hidden px-6 py-2 rounded bg-black/50 backdrop-blur-md hover:bg-black/70 border border-white/10 text-xs font-bold text-neutral-300 hover:text-white transition-all shadow"
      >
        <span>Load More</span>
        <i class="fa-solid fa-arrow-down text-[10px]"></i>
      </button>
    </div>
  </main>

  <!-- EMBEDDED PLAYER MODAL WITH MULTI-SERVER SUPPORT -->
  <div id="playerModal" class="fixed inset-0 z-50 hidden flex flex-col bg-black/80 backdrop-blur-xl transition-colors duration-200">
    <!-- Player Top Header -->
    <header class="p-2 sm:px-4 bg-black/60 backdrop-blur-md border-b border-white/10 flex flex-wrap items-center justify-between gap-2 z-20 shrink-0">
      <div class="flex items-center gap-2 max-w-xs sm:max-w-md truncate">
        <h3 id="playerTitle" class="text-xs sm:text-sm font-bold text-white truncate">Title</h3>
      </div>

      <!-- Controls: Server Switcher, Season & Episode Switchers -->
      <div class="flex items-center gap-2 flex-wrap">
        <!-- Server Switcher -->
        <div class="flex items-center gap-1">
          <span class="text-xs text-neutral-400 font-semibold">Server:</span>
          <select id="playerServerSelect" class="bg-black/60 border border-white/10 text-xs text-neutral-300 rounded px-2 py-1 focus:outline-none">
            <option value="vidcore">VidCore</option>
            <option value="viduki">VidUki</option>
            <option value="streamrip">StreamRip</option>
            <option value="vidfast">VidFast</option>
            <option value="vidfast_vc">VidFast VC</option>
            <option value="vidlink">VidLink</option>
            <option value="vidsrc">VidSrc.to</option>
          </select>
        </div>

        <!-- TV Controls (Visible only for TV Shows) -->
        <div id="tvControls" class="hidden items-center gap-2">
          <div class="flex items-center gap-1">
            <span class="text-xs text-neutral-400 font-semibold">Season:</span>
            <select id="playerSeasonSelect" class="bg-black/60 border border-white/10 text-xs text-neutral-300 rounded px-2 py-1 focus:outline-none">
              <option value="1">Season 1</option>
            </select>
          </div>

          <div class="flex items-center gap-1">
            <span class="text-xs text-neutral-400 font-semibold">Episode:</span>
            <select id="playerEpisodeSelect" class="bg-black/60 border border-white/10 text-xs text-neutral-300 rounded px-2 py-1 focus:outline-none">
              <option value="1">Ep 1</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Close Button -->
      <button id="btnClosePlayer" class="w-7 h-7 rounded bg-black/60 hover:bg-white hover:text-black border border-white/10 text-neutral-300 flex items-center justify-center transition-all">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>
    </header>

    <!-- Player iframe Canvas Area -->
    <div class="flex-1 w-full bg-transparent flex items-center justify-center relative">
      <iframe id="mediaPlayerIframe" src="" class="w-full h-full border-0 bg-transparent" allowfullscreen></iframe>
    </div>
  </div>

  <!-- JAVASCRIPT ENGINE -->
  <script>
    const TMDB_API_KEY = "3fd2be6f0c70a2a598f084ddfb75487c";
    const TMDB_IMG_BASE = "https://image.tmdb.org/t/p/w500";

    const state = {
      mode: 'MOVIE', // 'MOVIE' or 'TV'
      query: '',
      page: 1,
      hasMorePages: true,
      isLoading: false,
      items: [],
      activeItem: null,
      selectedSeason: 1
    };

    const $ = id => document.getElementById(id);
    const elements = {
      btnMovieMode: $('btnMovieMode'),
      btnTvMode: $('btnTvMode'),
      searchInput: $('searchInput'),
      btnClearSearch: $('btnClearSearch'),
      posterGrid: $('posterGrid'),
      emptyState: $('emptyState'),
      btnResetSearch: $('btnResetSearch'),
      btnLoadMore: $('btnLoadMore'),
      
      playerModal: $('playerModal'),
      btnClosePlayer: $('btnClosePlayer'),
      playerTitle: $('playerTitle'),
      playerServerSelect: $('playerServerSelect'),
      tvControls: $('tvControls'),
      playerSeasonSelect: $('playerSeasonSelect'),
      playerEpisodeSelect: $('playerEpisodeSelect'),
      mediaPlayerIframe: $('mediaPlayerIframe')
    };

    function init() {
      setupEventListeners();
      fetchVaultData(true);
    }

    function setupEventListeners() {
      elements.btnMovieMode.addEventListener('click', () => switchVaultMode('MOVIE'));
      elements.btnTvMode.addEventListener('click', () => switchVaultMode('TV'));

      let searchTimer;
      elements.searchInput.addEventListener('input', (e) => {
        const val = e.target.value.trim();
        elements.btnClearSearch.classList.toggle('hidden', !val);
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          state.query = val;
          fetchVaultData(true);
        }, 350);
      });

      elements.btnClearSearch.addEventListener('click', resetSearchField);
      elements.btnResetSearch.addEventListener('click', resetSearchField);

      elements.btnLoadMore.addEventListener('click', () => {
        if (!state.isLoading && state.hasMorePages) {
          state.page++;
          renderSkeletons(false);
          fetchVaultData(false);
        }
      });

      elements.btnClosePlayer.addEventListener('click', closePlayerModal);
      
      elements.playerServerSelect.addEventListener('change', () => updatePlayerFrame());

      elements.playerSeasonSelect.addEventListener('change', async (e) => {
        state.selectedSeason = parseInt(e.target.value);
        await updateEpisodesForSeason(state.activeItem.id, state.selectedSeason);
        updatePlayerFrame();
      });

      elements.playerEpisodeSelect.addEventListener('change', () => {
        updatePlayerFrame();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closePlayerModal(); }
      });
    }

    function resetSearchField() {
      elements.searchInput.value = '';
      elements.btnClearSearch.classList.add('hidden');
      state.query = '';
      fetchVaultData(true);
    }

    function switchVaultMode(newMode) {
      if (state.mode === newMode) return;
      state.mode = newMode;
      if (newMode === 'MOVIE') {
        elements.btnMovieMode.className = "px-3 py-1 rounded text-xs font-bold transition-all flex items-center gap-1.5 bg-white text-black shadow";
        elements.btnTvMode.className = "px-3 py-1 rounded text-xs font-bold transition-all flex items-center gap-1.5 text-neutral-400 hover:text-white";
      } else {
        elements.btnTvMode.className = "px-3 py-1 rounded text-xs font-bold transition-all flex items-center gap-1.5 bg-white text-black shadow";
        elements.btnMovieMode.className = "px-3 py-1 rounded text-xs font-bold transition-all flex items-center gap-1.5 text-neutral-400 hover:text-white";
      }
      fetchVaultData(true);
    }

    function renderSkeletons(reset = true) {
      const skeletons = Array(20).fill(0).map(() => `<div class="poster-card rounded skeleton-shimmer border border-white/5 relative overflow-hidden"></div>`).join('');
      if (reset) elements.posterGrid.innerHTML = skeletons;
      else elements.posterGrid.insertAdjacentHTML('beforeend', skeletons);
    }

    async function fetchVaultData(reset = true) {
      if (state.isLoading) return;
      state.isLoading = true;
      if (reset) { state.page = 1; state.items = []; renderSkeletons(true); }

      let url = "";
      if (state.query) {
        const endpoint = state.mode === 'MOVIE' ? 'movie' : 'tv';
        url = `https://api.themoviedb.org/3/search/${endpoint}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(state.query)}&page=${state.page}`;
      } else {
        const endpoint = state.mode === 'MOVIE' ? 'movie/popular' : 'tv/popular';
        url = `https://api.themoviedb.org/3/${endpoint}?api_key=${TMDB_API_KEY}&page=${state.page}`;
      }

      try {
        const response = await fetch(url);
        const data = await response.json();
        const results = data.results || [];

        state.hasMorePages = state.page < (data.total_pages || 1);
        state.items = reset ? results : [...state.items, ...results];
        renderPosterGrid();
        elements.btnLoadMore.classList.toggle('hidden', !state.hasMorePages);
      } catch (err) {
        if (reset) elements.posterGrid.innerHTML = '';
        elements.emptyState.classList.remove('hidden');
        elements.btnLoadMore.classList.add('hidden');
      } finally {
        state.isLoading = false;
      }
    }

    function renderPosterGrid() {
      if (!state.items || state.items.length === 0) {
        elements.posterGrid.innerHTML = '';
        elements.emptyState.classList.remove('hidden');
        elements.btnLoadMore.classList.add('hidden');
        return;
      }
      elements.emptyState.classList.add('hidden');
      elements.posterGrid.innerHTML = state.items.map((item, index) => {
        const title = item.title || item.name || 'Untitled';
        const posterPath = item.poster_path ? `${TMDB_IMG_BASE}${item.poster_path}` : 'https://placehold.co/400x600/000000/ffffff?text=No+Cover';
        return `
          <div data-index="${index}" class="poster-card group relative bg-black/20 backdrop-blur-sm rounded overflow-hidden border border-white/10 cursor-pointer transition-transform duration-200 hover:scale-[1.03] hover:z-20 hover:border-white/40 shadow-lg">
            <img src="${posterPath}" alt="${escapeHtml(title)}" loading="lazy" class="w-full h-full object-cover transition-opacity duration-300 group-hover:opacity-90 pointer-events-none">
          </div>
        `;
      }).join('');

      elements.posterGrid.querySelectorAll('.poster-card').forEach(card => {
        card.addEventListener('click', async () => {
          const idx = parseInt(card.getAttribute('data-index'));
          const item = state.items[idx];
          if (item) {
            await openPlayerModal(item);
          }
        });
      });
    }

    async function openPlayerModal(item) {
      state.activeItem = item;
      const title = item.title || item.name || 'Untitled';
      elements.playerTitle.textContent = title;

      if (state.mode === 'MOVIE') {
        elements.tvControls.classList.add('hidden');
      } else {
        elements.tvControls.classList.remove('hidden');
        try {
          const res = await fetch(`https://api.themoviedb.org/3/tv/${item.id}?api_key=${TMDB_API_KEY}`);
          const tvData = await res.json();
          const seasons = tvData.seasons || [{ season_number: 1, episode_count: 12 }];

          elements.playerSeasonSelect.innerHTML = seasons
            .filter(s => s.season_number > 0)
            .map(s => `<option value="${s.season_number}">Season ${s.season_number}</option>`).join('');

          state.selectedSeason = 1;
          await updateEpisodesForSeason(item.id, 1);
        } catch (e) {
          elements.playerSeasonSelect.innerHTML = `<option value="1">Season 1</option>`;
          elements.playerEpisodeSelect.innerHTML = `<option value="1">Ep 1</option>`;
        }
      }

      updatePlayerFrame();
      elements.playerModal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    async function updateEpisodesForSeason(tvId, seasonNum) {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/tv/${tvId}/season/${seasonNum}?api_key=${TMDB_API_KEY}`);
        const seasonData = await res.json();
        const epCount = seasonData.episodes ? seasonData.episodes.length : 12;

        let optionsHtml = '';
        for (let i = 1; i <= epCount; i++) {
          optionsHtml += `<option value="${i}">Ep ${i}</option>`;
        }
        elements.playerEpisodeSelect.innerHTML = optionsHtml;
      } catch (e) {
        elements.playerEpisodeSelect.innerHTML = `<option value="1">Ep 1</option>`;
      }
    }

    function updatePlayerFrame() {
      const item = state.activeItem;
      const server = elements.playerServerSelect.value;
      const id = item.id;
      const season = state.selectedSeason || 1;
      const episode = elements.playerEpisodeSelect.value || 1;

      let url = "";

      if (state.mode === 'MOVIE') {
        switch(server) {
          case 'vidcore':
            url = `https://vidcore.net/movie/${id}?autoPlay=true`;
            break;
          case 'viduki':
            url = `https://viduki.net/1/movie/${id}?color=ffffff`;
            break;
          case 'streamrip':
            url = `https://streamrip.fun/play?type=movie&id=${id}`;
            break;
          case 'vidfast':
            url = `https://vidfast.pro/movie/${id}`;
            break;
          case 'vidfast_vc':
            url = `https://vidfast.vc/movie/${id}?autoPlay=true`;
            break;
          case 'vidlink':
            url = `https://vidlink.pro/movie/${id}`;
            break;
          case 'vidsrc':
            url = `https://vidsrc.to/embed/movie/${id}`;
            break;
          default:
            url = `https://vidsrc.to/embed/movie/${id}`;
        }
      } else {
        switch(server) {
          case 'vidcore':
            url = `https://vidcore.net/tv/${id}/${season}/${episode}?autoPlay=true`;
            break;
          case 'viduki':
            url = `https://viduki.net/1/tv/${id}/${season}/${episode}?color=ffffff`;
            break;
          case 'streamrip':
            url = `https://streamrip.fun/play?type=tv&id=${id}&s=${season}&ep=${episode}`;
            break;
          case 'vidfast':
            url = `https://vidfast.pro/tv/${id}/${season}/${episode}`;
            break;
          case 'vidfast_vc':
            url = `https://vidfast.vc/tv/${id}/${season}/${episode}?autoPlay=true`;
            break;
          case 'vidlink':
            url = `https://vidlink.pro/tv/${id}/${season}/${episode}`;
            break;
          case 'vidsrc':
            url = `https://vidsrc.to/embed/tv/${id}/${season}/${episode}`;
            break;
          default:
            url = `https://vidsrc.to/embed/tv/${id}/${season}/${episode}`;
        }
      }

      elements.mediaPlayerIframe.src = url;
    }

    function closePlayerModal() {
      elements.playerModal.classList.add('hidden');
      document.body.style.overflow = '';
      elements.mediaPlayerIframe.src = '';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
